# Netlify deployment settings for StudyInChinaNow.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 5173
  publish = "dist"
  targetPort = 5173

# Every public page is prerendered at build time (scripts/prerender.mjs) into
# its own file, e.g. /scholarships/compare -> scholarships/compare.html, and
# Netlify serves that file directly because a matching file always wins over
# this rule. Everything else (/admin, the emailed admin login link, a
# programme published since the last build, a mistyped address) gets the empty
# app shell with status 200, and the browser router takes over while keeping
# the URL intact. The shell is not index.html, because that is now the
# prerendered home page.
[[redirects]]
  from = "/*"
  to = "/spa-fallback.html"
  status = 200

# Filenames under /assets are content-hashed by Vite, so a changed file gets a
# new name. Caching them forever is safe and keeps repeat visits quick on a
# phone connection.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or visitors keep loading an old build.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Keep the internal admin panel out of search results.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
